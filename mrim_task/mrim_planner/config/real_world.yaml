problem:
  name: "realworld.problem" # [surface_mine_small.problem, surface_mine_large.problem]
  plot: False

# Parameters for Traveling Salesman Problem
tsp:
  clustering: 'kmeans'                 # Clustering method of viewpoints: [random, kmeans]
  distance_estimates: 'euclidean_time' # Method for evaluating cost of paths in TSP heuristic: [euclidean, euclidean_time, astar, rrt, rrtstar]
  balance_viewpoints: true             # Re-balance the shared viewpoints between the UAVs to minimize the makespan
  balance_time_budget: 12.0            # (s) maximum time spent by the balancing (lower soft solution-time limit in the real world)
  detour_penalty: 1.5                  # Cost multiplier of obstructed straight-line connections in the flight time estimates

  # Optimization of the inspection poses on the tolerance shells (exact radius and
  # heading kept; smaller cone than in the virtual challenge: real-world tracking
  # errors eat into the tolerance margins)
  shell_dp:
    enabled: true
    cone_angle: 0.45    # (rad) half-angle of the candidate cone around the nominal viewpoint direction
    radius_slack: 0.0   # keep the exact radius/heading in the real world: the actual UAV pose is
    heading_slack: 0.0  # evaluated and the tracking errors need the full inspection tolerances

# Parameters for path planning
path_planner:
  timeout: 10.0              # (s) timeout for single start-to-goal planning
  method: 'astar'            # Method for generating start-to-goal paths: [euclidean, astar, rrt, rrtstar]
  straighten_paths: true     # Path straightening flag
  obstacle_margin: 0.1       # (m) additional planning margin added to the obstacle safety distance

  # RRT and RRT* method parameters (used as a fallback if A* fails)
  rrt:
    branch_size: 3.0 # (m)
    sampling:
      method: 'uniform' # Method for sampling random points: [uniform, gaussian]
      gaussian:
        stddev_inflation: 0.2 # Inflation of standard deviation in all axes during gaussian sampling (m)
    star:
      neighborhood: 3.0 # (m)

  # A* method parameters
  astar:
    grid_resolution: 0.4 # (m)

# Parameters for path smoothing
path_smoothing:
  sampling_step: 0.4      # (m)
  lookahead_dist: 0.8     # (m) Lookahead distance for path smoothing
  heading_hold_dist: 0.8  # (m) Distance along the path around the viewpoints in which the heading is held constant (larger in the real world: imperfect trajectory tracking)
  corner_arcs: false      # EXPERIMENTAL, keep disabled (see virtual.yaml)
  corner_arc_radius: 4.0  # (m) maximum corner arc radius

# Parameters for sampling the UAVs' trajectories
trajectory_sampling:
  with_stops: false # If true, UAVs will stop at each waypoint

# Additional safety margin on the dynamic constraints used for planning
# (more conservative in the real world: the reference is tracked imperfectly)
trajectories:
  dynamics_safety_factor: 0.90

# Parameters for UAV-to-UAV collision avoidance
collision_avoidance:
  method: 'delay_till_no_collisions_occur' # [none, delay_2nd_till_1st_UAV_finishes, delay_till_no_collisions_occur]
  mutual_margin: 0.5                       # (m) additional margin on the mutual distance used during collision resolution
