problem:
  name: "apocalypse_small.problem" # [apocalypse_small.problem, apocalypse_moderate.problem, apocalypse_large.problem]
  plot: False

# Parameters for Traveling Salesman Problem
tsp:
  clustering: 'kmeans'                 # Clustering method of viewpoints: [random, kmeans]
  distance_estimates: 'euclidean_time' # Method for evaluating cost of paths in TSP heuristic: [euclidean, euclidean_time, astar, rrt, rrtstar]
  balance_viewpoints: true             # Re-balance the shared viewpoints between the UAVs to minimize the makespan
  balance_time_budget: 20.0            # (s) maximum time spent by the balancing
  detour_penalty: 1.5                  # Cost multiplier of obstructed straight-line connections in the flight time estimates

  # Optimization of the inspection poses on the tolerance shells: for the fixed tour
  # sequence, pick the time-optimal pose on each inspection sphere within the cone.
  # The slacks spend a part of the inspection tolerances (dist 0.3 m, heading 0.2 rad)
  # to shorten the tour; the rest is kept as margin (virtual challenge tracks the
  # reference exactly, so a small slack is safe -- validated by the self-check)
  shell_dp:
    enabled: true
    cone_angle: 1.30    # (rad) half-angle of the candidate cone around the nominal viewpoint direction
    radius_slack: 0.25   # (m) allowed deviation from the nominal inspection radius (tolerance 0.3)
    heading_slack: 0.15 # (rad) allowed deviation from the nominal inspection heading (tolerance 0.2)

# Parameters for path planning
path_planner:
  timeout: 15.0              # (s) timeout for single start-to-goal planning
  method: 'astar'            # Method for generating start-to-goal paths: [euclidean, astar, rrt, rrtstar]
  straighten_paths: true     # Path straightening flag
  obstacle_margin: 0.1       # (m) additional planning margin added to the obstacle safety distance

  # RRT and RRT* method parameters (used as a fallback if A* fails)
  rrt:
    branch_size: 3.0 # (m)
    sampling:
      method: 'uniform' # Method for sampling random points: [uniform, gaussian]
      gaussian:
        stddev_inflation: 0.2 # Inflation of standard deviation in all axes during gaussian sampling (m)
    star:
      neighborhood: 3.0 # (m)

  # A* method parameters
  astar:
    grid_resolution: 0.4 # (m)

# Parameters for path smoothing
path_smoothing:
  sampling_step: 1.2      # (m) If horizontal constraints are not satisfied, TOPPRA might have returned infeasible trajectory due to too small sampling step
  lookahead_dist: 2.0     # (m) Lookahead distance for path smoothing
  heading_hold_dist: 0.6  # (m) Distance along the path around the viewpoints in which the heading is held constant
  corner_arcs: false      # EXPERIMENTAL, keep disabled: arc corner-rounding measured slower than the lookahead smoother (arcs rejected near obstacles pin the spline tighter)
  corner_arc_radius: 8.0  # (m) maximum corner arc radius

# Parameters for sampling the UAVs' trajectories
trajectory_sampling:
  with_stops: false # If true, UAVs will stop at each waypoint

# Additional safety margin on the dynamic constraints used for planning
# (0.97 validated on 9 problems: constraint checks pass with reserve, ~3% faster missions)
trajectories:
  dynamics_safety_factor: 0.97

# Parameters for UAV-to-UAV collision avoidance
collision_avoidance:
  method: 'delay_till_no_collisions_occur' # [none, delay_2nd_till_1st_UAV_finishes, delay_till_no_collisions_occur]
  mutual_margin: 0.3                       # (m) additional margin on the mutual distance used during collision resolution

# Simulation-specific parameters
simulation:
  flight_always_allowed: true # If true, the simulation of flight will start even if the trajectory will not conform all constraints

# Visualization parameters
visualization:
  rviz:
    use:            True
    playback_speed: 3.0
    horizon_length: 20

  python:
    trajectories:      False
    dynamics:          False
    mutual_distance:   False
    obstacle_distance: False
